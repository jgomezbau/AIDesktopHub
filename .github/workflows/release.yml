name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks, lint, and tests
        run: |
          npm run check:syntax
          npm run lint
          npm test

      - name: Build all Linux release artifacts (AppImage + deb + tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder \
            --linux AppImage deb tar.gz \
            --publish never

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.AppImage ./*.deb ./*.tar.gz > SHA256SUMS.txt

      - name: Create release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<EOF
          # AI Desktop Hub ${GITHUB_REF_NAME}

          ## What's new

          This release adds **Kimi** as an integrated AI Desktop Hub provider. Kimi launches from its official web application with an isolated Electron session, an in-app restricted navigation allowlist, a Linux desktop launcher, and its own runtime icon.

          It also hardens navigation by rejecting lookalike allowlist hosts and preventing remote content from navigating the embedded window to local `file://` URLs. Syntax checks, ESLint, provider/navigation tests, and the unpacked Electron build run before release artifacts are published.

          ## Supported assistants

          ChatGPT, Claude, Gemini, Grok, DeepSeek, Qwen, Z.ai, and Kimi.

          ## Artefactos incluidos

          - AppImage
          - Paquete **.deb**
          - Archivo **tar.gz**
          - **SHA256SUMS.txt**

          ## Installation

          On Debian or Ubuntu, install the **.deb** package. On other Linux distributions, make the AppImage executable and run it, or extract the **tar.gz** archive.

          ## Verification

          Descarga **SHA256SUMS.txt** junto con los artefactos y ejecuta:

              sha256sum --check SHA256SUMS.txt

          ## Requirements

          Runtime: Linux. Development and packaging: Node.js 20.19+ and npm 10+.

          ## Development

              npm install
              npm test
              npm run ci

          ## Kimi

          Start Kimi directly with `electron . --app=kimi` or `npm run start:kimi`.

          ## Release process

          - Los releases se disparan mediante tags semánticos, no mediante mensajes de commit.
          - Los pull requests ejecutan las validaciones de CI, pero no publican releases.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: AI Desktop Hub ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
